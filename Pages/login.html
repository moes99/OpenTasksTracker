<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Tasks Tracker: Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="../CSS/login.css" />
</head>
<body class="d-flex align-items-center py-5 bg-body-tertiary">
  <div class="container-fluid">
    <div class="d-flex flex-column align-items-center justify-content-center">
      <!-- Greeting -->
      <div class="d-flex flex-column align-items-center justify-content-center">
        <h1>Open Tasks Tracker</h1>
        <p>Login to access your tasks</p>
      </div>

      <!-- Login Form -->
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-md-9 col-lg-6 col-xl-5">
          <img
            src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
            class="img-fluid"
            alt="Sample image"
          />
        </div>
        <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
          <form class="mt-3">
            <!-- Email input -->
            <div data-mdb-input-init class="form-outline mb-4">
              <input
                type="email"
                id="formEmail"
                class="form-control"
                placeholder="Enter your email"
                required
              />
              <label class="form-label d-none" for="formEmail">Email</label>
            </div>

            <!-- Password input -->
            <div data-mdb-input-init class="form-outline mb-3">
              <input
                type="password"
                id="formPassword"
                class="form-control"
                placeholder="Enter password"
                required
              />
              <label class="form-label d-none" for="formPassword"
                >Password</label
              >
            </div>

            <!-- Login button -->
            <div class="text-center mt-2 pt-2">
              <button
                type="button"
                data-mdb-button-init
                data-mdb-ripple-init
                class="btn btn-primary"
                style="padding-left: 2.5rem; padding-right: 2.5rem"
                id="loginButton"
              >
                Login
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="../Scripts/login.js" type="module"></script>
</body>
