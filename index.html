<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Tasks Tracker</title>
    <link rel="icon" href="Resources/favicon.ico" type="image/x-icon" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="CSS/index.css" />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body class="d-flex flex-column min-vh-100 m-3">
    <!-- Navigation Bar -->
    <nav
      class="navbar navbar-expand-lg bg-body-tertiary mb-3 rounded-3 sticky-top shadow"
    >
      <div class="container-fluid">
        <i class="bi bi-calendar-check me-2" style="font-size: 1.5rem"></i>
        <a id="dateHeading" class="navbar-brand" href="#"> Open Tasks - </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul
            class="navbar-nav me-auto mb-2 mb-lg-0 w-100 justify-content-center"
          >
            <li class="nav-item mx-2">
              <a class="nav-link active" aria-current="page" href="#">Tasks</a>
            </li>
            <li class="nav-item mx-2">
              <a class="nav-link" aria-current="page" href="#">Services</a>
            </li>
            <li class="nav-item mx-2">
              <a class="nav-link" href="#">Apps</a>
            </li>
          </ul>
          <div class="row text-center align-items-center">
            <i
              class="bi bi-person-circle col-sm-2"
              style="font-size: 1.5rem"
            ></i>
            <a class="nav-link col-sm-8" href="#" id="currentUser"></a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Spinners -->
    <div class="d-flex align-items-center" id="spinners">
      <strong role="status">Loading Tasks...</strong>
      <div class="spinner-border text-primary ms-auto" aria-hidden="true"></div>
      <div
        class="spinner-border text-secondary ms-auto"
        aria-hidden="true"
      ></div>
      <div class="spinner-border text-success ms-auto" aria-hidden="true"></div>
      <div class="spinner-border text-danger ms-auto" aria-hidden="true"></div>
      <div class="spinner-border text-warning ms-auto" aria-hidden="true"></div>
    </div>

    <!-- Tasks Container -->
    <div
      class="row row-cols-1 row-cols-md-2 g-4 min-vh-100 p-0"
      id="tasksContainer"
    ></div>

    <!-- Add Task Button -->
    <button
      title="Add Task"
      type="button"
      class="btn btn-outline-success rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center shadow"
      id="addTaskBtn"
      style="width: 60px; height: 60px; z-index: 1050"
    >
      <i class="bi bi-plus-lg" style="font-size: 2rem"></i>
    </button>

    <!-- Main JavaScript Module -->
    <script src="Scripts/index.js" type="module"></script>
  </body>
</html>
